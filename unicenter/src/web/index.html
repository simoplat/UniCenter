<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UniCenter - Piattaforma moderna per la gestione universitaria di studenti, docenti e carriere accademiche." />
  <title>UniCenter • Gestione Universitaria</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow">
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
  </div>

  <div id="app">
    <!-- Topbar Navigation -->
    <header class="topbar">
      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <a href="/" class="brand">
          <div class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <span>UniCenter</span>
        </a>
        <span class="brand-badge">Academic Portal</span>
      </div>

      <div class="topbar-actions">
        <div id="demo-switcher-container"></div>
        <div id="topbar-user-section"></div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main id="main-content">
      <!-- Injected dynamically by app.js -->
    </main>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Reusable Modal Dialog -->
    <div id="app-modal" class="modal-backdrop">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title">Titolo Modale</h3>
          <button id="modal-close-btn" class="modal-close">&times;</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-footer" class="modal-footer"></div>
      </div>
    </div>
  </div>

  <!-- Main JavaScript App -->
  <script src="/js/app.js"></script>
</body>
</html>
